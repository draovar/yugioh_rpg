# Builds the game from a fresh clone (same steps as CLAUDE.md "Fresh clone") and publishes dist/ to GitHub Pages.
# Gitignored inputs (vendor/, public/data/, public/cards/, public/maps/) are regenerated here. Paid art packs live in the
# private Draovar/yugioh_rpg-assets repo (read with the ASSETS_DEPLOY_KEY deploy key); only the tiles the maps use reach the build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Card art from YGOPRODeck: cached so only new pool cards are downloaded.
      - uses: actions/cache@v4
        with:
          path: vendor/art
          key: art-${{ hashFiles('data/pool.json') }}
          restore-keys: art-

      # Paid tilesets → vendor/paid, packed into public/maps/ by build-tiles. Fails here if the deploy key is missing.
      - uses: actions/checkout@v4
        with:
          repository: Draovar/yugioh_rpg-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: vendor/paid

      - run: npm run fetch-data
      - run: npm run build-data
      - run: npm run fetch-art
      - run: npm run build-art
      - run: npm run build-tiles
      - run: npm run smoke -- 3
      - run: npm run smoke-p2p -- 3
      - run: npm run test-ai
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
