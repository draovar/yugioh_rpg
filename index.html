<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yu-Gi-Oh RPG</title>
  <!-- Added to a phone's home screen, the game opens without the browser bar (iOS has no Fullscreen API). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #040218; overflow: hidden; }
    /* dvh = the height actually visible: 100vh on phones is the height with the browser bar hidden, which pushes the
       centred canvas under the bar. */
    #game-container { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
